server:
  port: 8443
  ssl:
    enabled: true
    key-store-type: PKCS12
    key-store: /etc/openelis-global/keystore
    key-store-password: kspass
management:
  endpoint:
    health:
      show-details: always

# File watcher — faster polling for dev/CI (files are written atomically).
# Production keeps FileConfig.java defaults (5000ms poll, 3000ms stability).
bridge:
  file:
    poll-interval-ms: 1000
    file-stability-timeout-ms: 500

# Permit saved HL7 server connections; listening ports come from saved values.
org.itech.ahb.mllp:
  enabled: true
